<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Crossed lines decoration -->
  <line x1="0" y1="0" x2="1200" y2="630" stroke="#3b82f6" stroke-width="1" opacity="0.15"/>
  <line x1="1200" y1="0" x2="0" y2="630" stroke="#6366f1" stroke-width="1" opacity="0.15"/>
  <!-- Logo icon -->
  <rect x="80" y="80" width="64" height="64" rx="16" fill="url(#accent)"/>
  <line x1="96" y1="96" x2="128" y2="128" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="128" y1="96" x2="96" y2="128" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Text -->
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="white">Crossed</text>
  <text x="80" y="420" font-family="system-ui, sans-serif" font-size="36" fill="#94a3b8">Where paths cross again.</text>
  <text x="80" y="500" font-family="system-ui, sans-serif" font-size="28" fill="#64748b" font-style="italic">Privacy-first encounter memory app</text>
</svg>
